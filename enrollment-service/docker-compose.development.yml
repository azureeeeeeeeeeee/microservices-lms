services:
  enrollment-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: enrollment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://enrollment-postgres:5432/enrollment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:postgresql://enrollment-postgres:5432/enrollment_db
      - SPRING_FLYWAY_USER=postgres
      - SPRING_FLYWAY_PASSWORD=postgres
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_PROFILES_ACTIVE=dev
      - GRPC_CLIENT_USER_SERVICE_ADDRESS=static://user-service:5000
      - GRPC_CLIENT_USER_SERVICE_NEGOTIATIONTYPE=plaintext
      - GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE=plaintext
      - GRPC_CLIENT_COURSE_SERVICE_ADDRESS=static://course-service:5002
      - GRPC_CLIENT_COURSE_SERVICE_NEGOTIATIONTYPE=plaintext
      - GRPC_CLIENT_COURSE_SERVICE_NEGOTIATION_TYPE=plaintext
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8003:8003"
    depends_on:
      - enrollment-postgres
    networks:
      - internal

  enrollment-postgres:
    image: postgres:16
    container_name: enrollment-postgres
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6003:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  enrollment-adminer:
    image: adminer:latest
    container_name: enrollment-adminer
    ports:
      - "7003:8080"
    depends_on:
      - enrollment-postgres
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    external: true
    name: internal
