services:
  assignment-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: assignment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://assignment-postgres:5432/assignment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:postgresql://assignment-postgres:5432/assignment_db
      - SPRING_FLYWAY_USER=postgres
      - SPRING_FLYWAY_PASSWORD=postgres
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_PROFILES_ACTIVE=dev
      - GRPC_CLIENT_USER_SERVICE_ADDRESS=static://user-service:5000
      - GRPC_CLIENT_USER_SERVICE_NEGOTIATIONTYPE=plaintext
      - GRPC_CLIENT_USER_SERVICE_NEGOTIATION_TYPE=plaintext
      - GRPC_CLIENT_COURSE_SERVICE_ADDRESS=static://course-service:5002
      - GRPC_CLIENT_COURSE_SERVICE_NEGOTIATIONTYPE=plaintext
      - GRPC_CLIENT_COURSE_SERVICE_NEGOTIATION_TYPE=plaintext
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8003
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8004:8004"
    depends_on:
      - assignment-postgres
    networks:
      - internal

  assignment-postgres:
    image: postgres:16
    container_name: assignment-postgres
    environment:
      POSTGRES_DB: assignment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6004:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  assignment-adminer:
    image: adminer:latest
    container_name: assignment-adminer
    ports:
      - "7004:8080"
    depends_on:
      - assignment-postgres
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    external: true
    name: internal
