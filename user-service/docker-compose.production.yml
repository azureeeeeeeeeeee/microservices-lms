services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: user-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:postgresql://user-postgres:5432/user_db
      - SPRING_FLYWAY_USER=postgres
      - SPRING_FLYWAY_PASSWORD=postgres
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      # - SPRING_SQL_INIT_MODE=always
      # - BILLING_SERVICE_ADDRESS=billing-service
      # - BILLING_SERVICE_GRPC_PORT=9001
      # - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=c2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMtY2hhcmFjdGVycy1sb25nLWFuZC1iYXNlNjQtZW5jb2RlZA==
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8000:8000"
    depends_on:
      - user-postgres
    networks:
      - internal

  user-postgres:
    image: postgres:16
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  user-adminer:
    image: adminer:latest
    container_name: user-adminer
    ports:
      - "7000:8080"
    depends_on:
      - user-postgres
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    external: true
    name: internal