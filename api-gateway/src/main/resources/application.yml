server:
  port: 8001


spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: http://user-service:8000
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            - id: auth-service-route
              uri: http://user-service:8000
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
