server:
  port: 8001


spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: http://user-service:8000
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            - id: auth-service-route
              uri: http://user-service:8000
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: course-public
              uri: http://course-service:8002
              predicates:
                - Path=/api/courses/**
                - Method=GET
              filters:
                - StripPrefix=1
            - id: course-protected
              uri: http://course-service:8002
              predicates:
                - Path=/api/courses/**
                - Method=POST,PUT,DELETE
              filters:
                - StripPrefix=1
                - JwtValidation
            - id: enrollment-public
              uri: http://enrollment-service:8003
              predicates:
                - Path=/api/enrollments/**
                - Method=GET
              filters:
                - StripPrefix=1
            - id: enrollment-protected
              uri: http://enrollment-service:8003
              predicates:
                - Path=/api/enrollments/**
                - Method=POST,DELETE
              filters:
                - StripPrefix=1
                - JwtValidation
