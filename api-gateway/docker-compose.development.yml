services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=c2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTMtY2hhcmFjdGVycy1sb25nLWFuZC1iYXNlNjQtZW5jb2RlZA==
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8001:8001"
    networks:
      - internal

networks:
  internal:
    external: true
    name: internal
