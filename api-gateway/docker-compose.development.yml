services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8001:8001"
    networks:
      - internal

networks:
  internal:
    external: true
    name: internal
